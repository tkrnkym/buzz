# Sample Secret matching `secrets.existingSecret: nuxx-secrets`.
#
# Manage this via SealedSecrets / SOPS / External Secrets / Vault — anything
# that keeps the unencrypted form out of git. The chart reads keys it finds
# and leaves the rest as Pod env vars marked `optional: true`.
#
# Keys consumed by the relay (all optional unless required by relay config):
#   NUXX_RELAY_PRIVATE_KEY        — 64-char hex; relay identity (do NOT rotate)
#   NUXX_GIT_HOOK_HMAC_SECRET     — 32+ chars; required when replicaCount > 1
#   DATABASE_URL                  — postgres://...
#   READ_DATABASE_URL             — postgres://... (optional read-replica; omit to disable read routing)
#   REDIS_URL                     — redis://...  (required when replicaCount > 1)
#   NUXX_S3_ACCESS_KEY
#   NUXX_S3_SECRET_KEY
apiVersion: v1
kind: Secret
metadata:
  name: nuxx-secrets
  namespace: nuxx
type: Opaque
stringData:
  NUXX_RELAY_PRIVATE_KEY: "REPLACE_WITH_64_HEX"
  NUXX_GIT_HOOK_HMAC_SECRET: "REPLACE_WITH_RANDOM_64_CHARS"
  DATABASE_URL: "postgres://nuxx:REPLACE@postgres.nuxx.svc.cluster.local:5432/nuxx?sslmode=require"
  REDIS_URL: "redis://:REPLACE@redis.nuxx.svc.cluster.local:6379"
  NUXX_S3_ACCESS_KEY: "REPLACE"
  NUXX_S3_SECRET_KEY: "REPLACE"

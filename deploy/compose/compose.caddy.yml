services:
  relay:
    ports: !reset []

  caddy:
    image: caddy:2-alpine
    depends_on:
      relay:
        condition: service_healthy
    environment:
      NUXX_DOMAIN: ${NUXX_DOMAIN:?set NUXX_DOMAIN}
    ports:
      - "${CADDY_HTTP_PORT:-80}:80"
      - "${CADDY_HTTPS_PORT:-443}:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - nuxx-caddy-data:/data
      - nuxx-caddy-config:/config
    restart: unless-stopped
    networks:
      - nuxx-net

volumes:
  nuxx-caddy-data:
    labels:
      com.nuxx.volume: caddy-data
  nuxx-caddy-config:
    labels:
      com.nuxx.volume: caddy-config

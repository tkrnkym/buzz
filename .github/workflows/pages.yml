# Static demo on GitHub Pages.
#
# Builds the real web client with the in-browser mock relay
# (web/src/mock/, enabled by VITE_MOCK_RELAY=1) — no backend involved. The
# UI, timeline behavior, unread badges, threads, and publish round-trips are
# the production code paths running against seeded events.
#
# configure-pages runs with `enablement: true`, so the first run creates the
# Pages site itself — no manual Settings → Pages step. Run #1 failed exactly
# there before this was set.
#
# The Vite base and the router basepath come from VITE_BASE, derived from the
# repository name so the site survives the repo rename. 404.html is a copy of
# index.html: GitHub Pages serves it for unknown paths, which is what lets a
# deep link like /c/<channel> boot the SPA.
name: Deploy demo to GitHub Pages

on:
  push:
    branches: [main, claude/buzz-cloud-operations-3s0kyx]
    paths:
      - "web/**"
      - "pnpm-lock.yaml"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
      - uses: cashapp/activate-hermit@cea9af7913204a965fd488637a8d1811bba2e616 # v1
      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile
      - name: Build the mock demo
        env:
          VITE_MOCK_RELAY: "1"
          VITE_BASE: /${{ github.event.repository.name }}/
        run: pnpm -C web build
      - name: Add the SPA 404 fallback
        run: cp web/dist/index.html web/dist/404.html
      - uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

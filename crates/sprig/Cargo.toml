[package]
name = "sprig"
# Independent version: sprig ships as a pinnable artifact (sprig-v* tags),
# released on its own cadence. It does NOT inherit the workspace version.
version = "0.1.0"
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
description = "All-in-one Nuxx ACP harness, agent, and developer MCP"

[[bin]]
name = "sprig"
path = "src/main.rs"

[dependencies]
nuxx-acp = { path = "../nuxx-acp" }
nuxx-agent = { path = "../nuxx-agent" }
nuxx-dev-mcp = { path = "../nuxx-dev-mcp" }
